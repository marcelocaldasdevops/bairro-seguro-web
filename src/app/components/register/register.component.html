<div class="auth-wrapper">
    <div class="glass-card auth-card animate-fade-in">
        <div class="auth-header">
            <div class="auth-icon">🛡️</div>
            <h2>Criar Conta</h2>
            <p class="subtitle">Faça parte da rede de proteção do seu bairro</p>
        </div>

        <form (submit)="onSubmit()" class="auth-form mt-8">
            <div class="input-group">
                <label>Usuário</label>
                <div class="input-container">
                    <span class="input-icon">👤</span>
                    <input type="text" [(ngModel)]="userData.username" name="username" required placeholder="Ex: joaosilva">
                </div>
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <div class="input-container">
                    <span class="input-icon">✉️</span>
                    <input type="email" [(ngModel)]="userData.email" name="email" required placeholder="seu@email.com">
                </div>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <div class="input-container">
                    <span class="input-icon">🔒</span>
                    <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="userData.password" name="password" required placeholder="••••••••">
                    <button type="button" class="eye-btn" (click)="togglePassword()">
                        {{ showPassword ? '👁️' : '🙈' }}
                    </button>
                </div>
            </div>
            <div class="input-group">
                <label>Confirmar Senha</label>
                <div class="input-container">
                    <span class="input-icon">🔄</span>
                    <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="userData.confirmPassword" name="confirmPassword" required placeholder="••••••••">
                    <button type="button" class="eye-btn" (click)="toggleConfirmPassword()">
                        {{ showConfirmPassword ? '👁️' : '🙈' }}
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full mt-4" 
                [disabled]="isLoading || !userData.confirmPassword || userData.password !== userData.confirmPassword">
                <span *ngIf="!isLoading">Criar Minha Conta ✨</span>
                <span *ngIf="isLoading">⏳ Criando Conta...</span>
            </button>
        </form>

        <div class="auth-footer mt-8">
            <p class="footer-link">
                Já tem uma conta? <a routerLink="/login">Fazer Login</a>
            </p>
        </div>
    </div>
</div>
