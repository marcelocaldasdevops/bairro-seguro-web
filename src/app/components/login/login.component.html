<div class="auth-wrapper">
    <div class="glass-card auth-card animate-fade-in">
        <div class="auth-header">
            <img src="assets/logo.png" alt="Logo" class="auth-logo">
            <h2>Bem-vindo</h2>
            <p class="subtitle">Acesse sua conta para colaborar</p>
        </div>

        <form (submit)="onSubmit()" class="auth-form mt-8">
            <div class="input-group">
                <label>E-mail</label>
                <div class="input-container">
                    <span class="input-icon">✉️</span>
                    <input type="email" [(ngModel)]="credentials.email" name="email" required placeholder="Seu e-mail">
                </div>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <div class="input-container">
                    <span class="input-icon">🔒</span>
                    <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="credentials.password" name="password" required
                        placeholder="••••••••">
                    <button type="button" class="eye-btn" (click)="togglePassword()">
                        {{ showPassword ? '👁️' : '🙈' }}
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full mt-4" [disabled]="isLoading">
                <span *ngIf="!isLoading">Entrar →</span>
                <span *ngIf="isLoading">⏳ Entrando...</span>
            </button>
        </form>

        <div class="auth-footer mt-8">
            <p class="footer-link">
                Novo por aqui? <a routerLink="/register">Criar uma conta</a>
            </p>
        </div>
    </div>
</div>
